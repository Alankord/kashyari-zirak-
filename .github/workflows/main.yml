name: Build EXE

on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          # ئەمە بەگوێرەی پڕۆژەکەت دەگۆڕی
          g++ main.cpp -o program.exe
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
